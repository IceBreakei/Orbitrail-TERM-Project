<!doctype html><html><head><meta charset="utf-8"><base href="../"><link rel="stylesheet" href="movement.css"><style>body{margin:0;padding:0}.simulated-screen{width:100vw;height:100vh;max-width:none;background:#335a7b}#arena{width:100%;height:100%;border:0}#layout-report{display:none}</style></head><body><div class="simulated-screen"><canvas id="arena" width="1000" height="650"></canvas><section id="level-up-menu" class="level-up-overlay" hidden><aside class="level-up-character"><img id="level-up-portrait" class="pause-hologram" hidden><div class="level-up-character-copy"><h2 id="level-up-title">LEVEL UP!</h2><h3 id="level-up-name"></h3><div id="level-up-stats"></div></div></aside><div class="level-up-selection"><p id="level-up-progress"></p><div id="level-up-choices"></div><button id="level-up-continue" hidden>Continue</button><p id="level-up-help" class="level-up-help">Choose an upgrade to continue.</p></div></section></div><pre id="layout-report"></pre><script type="module">
import {createLevelUpMenu} from './level-up-menu.js';
import {createPhrenapatesSkill,createCelestiaSkill} from './game-config.js';
import {createChisePlushie,createLifeJacket} from './item-catalog.js';
import {rollLevelUpgrades} from './level-upgrades.js';
const player={label:'Plana',hp:70,maxHp:70,baseATK:130,baseSPD:130,baseCritPercent:10,attackSlots:[],equipmentSlots:[createChisePlushie(),createLifeJacket()],characterSkills:[createPhrenapatesSkill(),createCelestiaSkill()],pendingUpgrades:1};
const keep=new Set(['phrenapates','celestia','chise-plushie','life-jacket']);player.eliminatedUpgradeIds=rollLevelUpgrades(player,{all:true}).filter(c=>!keep.has(c.weapon.id)).map(c=>c.weapon.id);
const menu=createLevelUpMenu({canvas:document.querySelector('#arena'),getPlayer:()=>player,isPauseMenuOpen:()=>false,releaseControls(){},onOpen(){},onChoose(){}});menu.update();
setTimeout(()=>{const overlay=document.querySelector('#level-up-menu');const cards=[...document.querySelectorAll('.level-up-choice')];document.querySelector('#layout-report').textContent=JSON.stringify({viewport:[innerWidth,innerHeight],overlay:[overlay.clientHeight,overlay.scrollHeight],heights:cards.map(c=>c.getBoundingClientRect().height),fit:cards.map(c=>{const p=c.querySelector('p'),canvas=p.querySelector('canvas');return {available:[p.clientWidth,p.clientHeight],ink:[canvas.width,canvas.height],fits:canvas.height<=p.clientHeight+1&&canvas.width<=p.clientWidth+1}}),bottom:cards.at(-1).getBoundingClientRect().bottom});},1200);
</script></body></html>
