<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../Development/movement.css"><link rel="stylesheet" href="../Development/title-menu.css"><style>body{margin:0;background:#08284c}.simulated-screen{width:1120px;margin:20px auto;container-type:inline-size;background:#12334c}</style><div class="simulated-screen"><section id="pause-quit-confirmation" class="pause-quit-confirmation" role="alertdialog" aria-modal="true" aria-label="Quit to home?"><div class="pause-quit-card"><h2><canvas id="pause-quit-title" aria-label="Quit?"></canvas></h2><button type="button" class="selected" id="pause-quit-yes" aria-label="Yes, return home">Yes</button><button type="button" id="pause-quit-no" aria-label="No, stay paused">No</button></div></section></div><script type="module">import {createBitmapText} from '../Development/bitmap-font.js';createBitmapText(document.querySelector('#pause-quit-title'),{variant:'font2',scale:2}).setText('QUIT?');for(const [id,label]of [['pause-quit-yes','Yes'],['pause-quit-no','No']]){const b=document.getElementById(id),c=document.createElement('canvas');b.replaceChildren(c);createBitmapText(c,{variant:'font2',scale:1.5}).setText(label);}</script>
