<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation Orbitrail | Log in</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
    <script type="module" src="login-splash.js"></script>
  </head>
  <body class="login-page">
    <main class="auth-layout">
      <!-- Full-screen splash sits behind the form; CSS blends the two along a soft diagonal. -->
      <section class="intro splash-intro" aria-label="Operation Orbitrail">
        <figure class="login-splash">
          <img class="is-current" src="sprites/OrbitrailTitle1.png" width="1672" height="941"
            alt="Operation Orbitrail: Plana and Arona lead the way through a Schale hallway filled with enemies."
            fetchpriority="high" decoding="async">
          <img src="sprites/OrbitrailTitle2.png" alt="" aria-hidden="true" decoding="async">
          <img src="sprites/OrbitrailTitle3.png" alt="" aria-hidden="true" decoding="async">
          <img src="sprites/OrbitrailTitle4.png" alt="" aria-hidden="true" decoding="async">
        </figure>
      </section>
      <section class="form-panel">
        <div class="auth-card">
          <h2 id="form-title">Welcome back, Sensei</h2>
          <p class="subtitle" id="form-description">
            Log in to continue.
          </p>
          <!-- JavaScript switches this form between login and registration. -->
          <form id="auth-form">
            <!-- Name is shown and required only when creating an account. -->
            <div id="name-field" hidden>
              <label for="name">Sensei name</label>
              <input id="name" name="name" autocomplete="name" placeholder="Your Sensei name" maxlength="100">
            </div>
            <div>
              <label for="email">Email address</label>
              <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required maxlength="254">
            </div>
            <div>
              <label for="password">Password</label>
              <div class="password-wrap">
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
                <button class="reveal" type="button" aria-label="Show password" aria-pressed="false">Show</button>
              </div>
              <p class="hint" id="password-hint" hidden>
                Use at least 8 characters.
              </p>
            </div>
            <p id="message" class="message" role="status" aria-live="polite"></p>
            <button class="submit" type="submit">
              <span id="submit-label">Log in</span>
              <span aria-hidden="true">→</span>
            </button>
          </form>
          <button id="continue-as-guest" class="guest-button" type="button">Continue as guest</button>
          <p class="switch-copy">
            <span id="switch-prompt">Don't have an account?</span>
            <button id="switch-mode" type="button">Create an account</button>
          </p>
        </div>
      </section>
    </main>
    <dialog id="guest-confirmation" aria-labelledby="guest-title" aria-describedby="guest-warning">
      <h2 id="guest-title">Continue as guest?</h2>
      <p id="guest-warning">Your upgrades, progress, and other game data will not be saved. Do you wish to proceed?</p>
      <form method="dialog" class="guest-dialog-actions">
        <button type="submit" value="cancel" autofocus>Cancel</button>
        <button type="submit" value="continue">Continue as guest</button>
      </form>
    </dialog>
  </body>
</html>
